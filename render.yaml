# Render blueprint for the GFS AI search service.
# New > Blueprint > pick this repo. Render asks for the three values marked sync:false.
services:
  - type: web
    name: gfs-ai-search
    runtime: python
    plan: starter              # always-on (free plans sleep, which would make search slow)
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    disk:                      # keeps the catalog index across restarts and deploys
      name: search-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /data
      - key: BC_STORE_HASH      # store hash the search should index (see DEPLOY.md)
        sync: false
      - key: BC_ACCESS_TOKEN    # BigCommerce API account, "Products: read-only" scope
        sync: false
      - key: ANTHROPIC_API_KEY  # optional: turns on Ask AI
        sync: false
      - key: ALLOWED_ORIGINS    # websites allowed to call the API (comma separated)
        value: https://globalfuelingsystems.com,https://sandbox377.mybigcommerce.com
      - key: ASK_PER_IP_HOUR
        value: "20"
      - key: ASK_DAILY_CAP
        value: "1000"
